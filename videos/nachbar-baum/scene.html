<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Nachbar-Baum – Szene</title>
<style>
  @font-face { font-family: "Lucky"; src: url("vendor/luckiest-guy.woff2") format("woff2"); }
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #8fd0f5; }
  #sky { position: absolute; inset: 0; background: linear-gradient(#5fb6ee 0%, #a9dcf7 55%, #d9f0fb 100%); }
  #storm { position: absolute; inset: 0; background: linear-gradient(#2c3440, #59636f); opacity: 0; }
  canvas { position: absolute; inset: 0; }
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
  #cap {
    position: absolute; left: 0; right: 0; top: 1180px; text-align: center;
    font-family: "Lucky", sans-serif; font-size: 150px; line-height: 1; color: #fff;
    -webkit-text-stroke: 22px #111; paint-order: stroke fill;
    text-shadow: 0 12px 0 rgba(0,0,0,.55);
    transform-origin: 50% 60%; white-space: nowrap; letter-spacing: 2px;
  }
  #cap.key { color: #ffd400; }
  .ov { position: absolute; left: 50%; top: 300px; transform: translateX(-50%); opacity: 0; }
  .ovlabel {
    font-family: "Lucky", sans-serif; font-size: 72px; color: #fff; text-align: center;
    -webkit-text-stroke: 14px #111; paint-order: stroke fill; margin-top: 10px;
  }
  #handle {
    position: absolute; left: 0; right: 0; top: 1420px; text-align: center; opacity: 0;
    font-family: "Lucky", sans-serif; font-size: 70px; color: #fff;
    -webkit-text-stroke: 12px #111; paint-order: stroke fill;
  }
</style>
</head>
<body>
<div id="sky"></div>
<div id="storm"></div>
<div id="flash"></div>

<!-- Overlay: Verbot (nicht sofort absägen) -->
<div id="ovNo" class="ov">
  <svg width="360" height="360" viewBox="0 0 100 100">
    <circle cx="50" cy="50" r="42" fill="rgba(255,255,255,.85)" stroke="#111" stroke-width="10"/>
    <circle cx="50" cy="50" r="42" fill="none" stroke="#e5262b" stroke-width="7"/>
    <g transform="translate(50 52) rotate(-20)">
      <rect x="-26" y="-9" width="40" height="16" rx="2" fill="#9aa4ad" stroke="#111" stroke-width="2.5"/>
      <path d="M-26 7 l4 5 l4 -5 l4 5 l4 -5 l4 5 l4 -5 l4 5 l4 -5 l4 5 l4 -5" fill="none" stroke="#111" stroke-width="2"/>
      <rect x="14" y="-12" width="14" height="22" rx="4" fill="#8a5a2b" stroke="#111" stroke-width="2.5"/>
    </g>
    <line x1="20" y1="20" x2="80" y2="80" stroke="#111" stroke-width="13" stroke-linecap="round"/>
    <line x1="20" y1="20" x2="80" y2="80" stroke="#e5262b" stroke-width="8" stroke-linecap="round"/>
  </svg>
</div>

<!-- Overlay: Frist-Uhr -->
<div id="ovClock" class="ov">
  <svg width="340" height="340" viewBox="0 0 100 100">
    <circle cx="50" cy="50" r="42" fill="#fff" stroke="#111" stroke-width="8"/>
    <g id="ticks"></g>
    <path id="sweep" fill="rgba(255,212,0,.75)" d=""/>
    <line id="hand" x1="50" y1="50" x2="50" y2="18" stroke="#111" stroke-width="6" stroke-linecap="round"/>
    <circle cx="50" cy="50" r="5" fill="#e5262b" stroke="#111" stroke-width="2"/>
  </svg>
  <div class="ovlabel">FRIST</div>
</div>

<!-- Overlay: Fragezeichen beim Nachbarn -->
<div id="ovQ" class="ov" style="top:260px">
  <div class="ovlabel" style="font-size:260px;-webkit-text-stroke:26px #111;color:#ffd400">?</div>
</div>

<!-- Overlay: Haken am Ende -->
<div id="ovOk" class="ov">
  <svg width="340" height="340" viewBox="0 0 100 100">
    <circle cx="50" cy="50" r="42" fill="#2fbf4a" stroke="#111" stroke-width="8"/>
    <path d="M30 52 L45 66 L72 36" fill="none" stroke="#111" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M30 52 L45 66 L72 36" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
</div>

<div id="cap"></div>
<div id="handle">@DEIN.DACH.ACCOUNT</div>

<script src="vendor/three.min.js"></script>
<script>
// ---------- Helfer ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const smooth = (a, b, t) => { const k = clamp((t - a) / (b - a)); return k * k * (3 - 2 * k); };
const backOut = k => { const s = 1.9; k = clamp(k) - 1; return k * k * ((s + 1) * k + s) + 1; };
const pop = (a, d, t) => (t < a ? 0 : backOut((t - a) / d));
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const R = rng(42);

// ---------- Renderer / Szene ----------
const W = 1080, H = 1920;
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setSize(W, H); renderer.setPixelRatio(1);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.insertBefore(renderer.domElement, document.getElementById('flash'));

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, W / H, 0.1, 200);

const hemi = new THREE.HemisphereLight(0xdff3ff, 0x5b7a3a, 1.25); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff3dd, 2.1);
sun.position.set(14, 26, 12); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -20, right: 20, top: 20, bottom: -20, near: 1, far: 70 });
sun.shadow.bias = -0.0008; sun.shadow.normalBias = 0.03;
scene.add(sun);

const mat = c => new THREE.MeshStandardMaterial({ color: c, flatShading: true, roughness: 0.9, metalness: 0 });
function box(w, h, d, c, x = 0, y = 0, z = 0, parent = scene) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), typeof c === 'number' ? mat(c) : c);
  m.position.set(x, y, z); m.castShadow = m.receiveShadow = true; parent.add(m); return m;
}
function blob(r, c, x, y, z, parent = scene, detail = 0) {
  const m = new THREE.Mesh(new THREE.IcosahedronGeometry(r, detail), mat(c));
  m.position.set(x, y, z); m.castShadow = m.receiveShadow = true; parent.add(m); return m;
}
function stick(a, b, r1, r2, c, parent = scene) {
  const A = new THREE.Vector3(...a), B = new THREE.Vector3(...b);
  const len = A.distanceTo(B);
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r2, r1, len, 7), mat(c));
  m.position.copy(A).add(B).multiplyScalar(0.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), B.clone().sub(A).normalize());
  m.castShadow = m.receiveShadow = true; parent.add(m); return m;
}

// ---------- Insel (Diorama) ----------
const IX = 28, IZ = 20, CX = 2;
box(IX, 0.3, IZ, 0x6cc04a, CX, -0.15, 0);
// Rasenstreifen
for (let i = 0; i < 14; i++) if (i % 2) box(IX / 14, 0.02, IZ, 0x63b543, CX - IX / 2 + (i + 0.5) * IX / 14, 0.01, 0).castShadow = false;
box(IX, 1.6, IZ, 0x8b5a33, CX, -1.1, 0);
box(IX, 1.8, IZ, 0x6e4426, CX, -2.8, 0);
box(IX + 0.02, 0.35, IZ + 0.02, 0x9c9a94, CX, -0.45, 0); // Schotterschicht
for (let i = 0; i < 70; i++) {
  const front = R() < 0.6;
  const x = front ? CX - IX / 2 + R() * IX : CX + IX / 2 + 0.02;
  const z = front ? IZ / 2 + 0.02 : -IZ / 2 + R() * IZ;
  blob(0.08 + R() * 0.12, R() < 0.5 ? 0x4a3020 : 0xb9b2a5, x, -0.8 - R() * 2.8, z);
}

// Gehweg & Weg zur Tür
box(IX, 0.06, 1.6, 0xc9c6bf, CX, 0.03, 8.6);
box(1.6, 0.06, 5.2, 0xd8d4cc, -1, 0.03, 5.6);

// ---------- Dein Haus ----------
const HX = -1, HW = 4, WALL = 4, PITCH = THREE.MathUtils.degToRad(35), DEP = 3;
box(HW * 2, WALL, DEP * 2, 0xf3f1ec, HX, WALL / 2, 0);
// Giebeldreiecke
const tri = new THREE.Shape(); const rise = HW * Math.tan(PITCH);
tri.moveTo(-HW, 0); tri.lineTo(HW, 0); tri.lineTo(0, rise); tri.lineTo(-HW, 0);
for (const z of [DEP - 0.15, -DEP - 0.15]) {
  const g = new THREE.Mesh(new THREE.ExtrudeGeometry(tri, { depth: 0.3, bevelEnabled: false }), mat(0xf3f1ec));
  g.position.set(HX, WALL, z); g.castShadow = g.receiveShadow = true; scene.add(g);
}
// Fenster & Tür
const dark = 0x3a4652;
box(1.2, 2.2, 0.08, 0x5a3a22, HX, 1.1, DEP + 0.04);
for (const x of [HX - 2.6, HX + 2.6]) { box(1.2, 1.2, 0.08, dark, x, 2.6, DEP + 0.04); box(1.4, 0.12, 0.2, 0xffffff, x, 1.95, DEP + 0.08); }
box(1.0, 1.0, 0.08, dark, HX, WALL + 1.2, DEP + 0.18);
for (const z of [-1.6, 1.6]) box(0.08, 1.2, 1.2, dark, HX + HW + 0.04, 2.6, z);

// Dach mit Schnitt (Ziegel / Lattung / Folie / Dämmung) – Markenzeichen
const RIDGE_Y = WALL + rise + 0.55, OVER = 0.7, L = (HW + OVER) / Math.cos(PITCH), RD = DEP + 0.45;
function slope(side) {
  const g = new THREE.Group();
  g.position.set(HX, RIDGE_Y, 0); g.rotation.z = side * -PITCH; scene.add(g);
  const sx = side; // +1 rechts, -1 links
  box(L, 0.36, RD * 2, 0xf2c94c, sx * L / 2, -0.33, 0, g);          // Dämmung
  box(L, 0.05, RD * 2, 0x2f80ed, sx * L / 2, -0.125, 0, g);         // Folie
  for (let i = 0; i < 9; i++) box(0.12, 0.1, RD * 2, 0x9b6a3c, sx * (0.3 + i * (L - 0.4) / 8), -0.05, 0, g); // Lattung
  const rows = 10;
  for (let i = 0; i < rows; i++) {
    const t = box(L / rows * 1.15, 0.16, RD * 2, i % 2 ? 0xc0442c : 0xb33d27, sx * (i + 0.55) * L / rows, 0.08, 0, g);
    t.rotation.z = side * 0.06;
  }
  for (let i = 0; i < 5; i++) box(0.5, 0.6, 0.12, 0x6d4a2c, sx * (0.6 + i * (L - 1) / 4), -0.75, RD - 0.3, g); // Sparren-Enden
  return g;
}
const slopeR = slope(1), slopeL = slope(-1);
box(0.5, 0.3, RD * 2, 0x8f2f1f, HX, RIDGE_Y + 0.14, 0); // First

// Weltkoordinaten auf der rechten Dachfläche
function onRoofR(s, z, up = 0.2) {
  const x = HX + s * Math.cos(PITCH) + up * Math.sin(PITCH);
  const y = RIDGE_Y - s * Math.sin(PITCH) + up * Math.cos(PITCH);
  return new THREE.Vector3(x, y, z);
}
// Dachrinne + Fallrohr
const eave = onRoofR(L, 0, -0.1);
const gutter = new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.24, RD * 2, 10, 1, true, 0, Math.PI), new THREE.MeshStandardMaterial({ color: 0x9aa3ab, side: THREE.DoubleSide, flatShading: true }));
gutter.rotation.x = Math.PI / 2; gutter.rotation.y = Math.PI / 2;
gutter.position.set(eave.x + 0.2, eave.y - 0.15, 0); gutter.castShadow = true; scene.add(gutter);
stick([eave.x + 0.2, eave.y - 0.3, RD - 0.3], [eave.x + 0.2, 0.1, RD - 0.3], 0.12, 0.12, 0x9aa3ab);
const gutterGlow = box(0.6, 0.12, RD * 2 + 0.2, new THREE.MeshBasicMaterial({ color: 0xff3030, transparent: true, opacity: 0 }), eave.x + 0.2, eave.y + 0.02, 0);
gutterGlow.castShadow = false;

// lose Ziegel, die im Sturm wegfliegen
const looseTiles = [[2.2, -1.6, 8.25], [3.1, 0.4, 8.75], [1.6, 1.9, 9.25]].map(([s, z, tt], i) => {
  const p = onRoofR(s, z, 0.26);
  const m = box(0.75, 0.14, 0.7, 0xc84a30, p.x, p.y, p.z);
  m.rotation.z = -PITCH;
  const land = new THREE.Vector3(5.0 + i * 0.5, 0.08, z + 2.5 + i * 0.8);
  return { m, p, land, tt };
});

// Hecken vorne
for (let i = 0; i < 9; i++) blob(0.6, 0x3f9a3a, -9 + i * 1.4, 0.45, 7.2);
for (let i = 0; i < 4; i++) blob(0.6, 0x3f9a3a, 3 + i * 0.9, 0.45, 7.2);

// ---------- Grenze & Nachbargrundstück ----------
const BX = 6;
for (let z = -9.5; z <= 9.5; z += 0.6) box(0.12, 0.9, 0.12, 0xffffff, BX, 0.45, z);
box(0.08, 0.1, 19.2, 0xffffff, BX, 0.75, 0); box(0.08, 0.1, 19.2, 0xffffff, BX, 0.35, 0);
const borderWall = box(0.04, 10, 19.4, new THREE.MeshBasicMaterial({ color: 0xff2a2a, transparent: true, opacity: 0, side: THREE.DoubleSide, depthWrite: false }), BX, 5, 0);
borderWall.castShadow = false; borderWall.receiveShadow = false;

// Nachbarhaus (klein, hinten)
box(5, 3.2, 4, 0xece6da, 11.5, 1.6, -6.5);
const nRoof = new THREE.Mesh(new THREE.ConeGeometry(3.9, 2.2, 4), mat(0x7d4f3a));
nRoof.position.set(11.5, 4.3, -6.5); nRoof.rotation.y = Math.PI / 4; nRoof.castShadow = true; scene.add(nRoof);
box(0.08, 1, 1, dark, 9, 1.8, -5.6); box(1, 1, 0.08, dark, 11, 1.8, -4.46);

// Baum des Nachbarn
const tree = new THREE.Group(); tree.position.set(10, 0, -0.5); scene.add(tree);
stick([0, 0, 0], [0, 5.6, 0], 0.55, 0.38, 0x7a4b28, tree);
stick([0, 4.2, 0], [1.3, 6.5, 0.6], 0.3, 0.18, 0x7a4b28, tree);
[[0, 7.6, 0, 2.4], [1.4, 7.0, 1.0, 1.8], [-0.9, 7.2, -1.0, 1.9], [0.6, 8.6, -0.4, 1.7], [1.8, 7.8, -1.2, 1.5], [-0.4, 6.4, 1.4, 1.4]]
  .forEach(([x, y, z, r], i) => blob(r, i % 2 ? 0x3d8b37 : 0x4aa043, x, y, z, tree));
// Ast: innen (Nachbarseite) fest, außen (über deinem Dach) beweglich
const PIV = new THREE.Vector3(BX, 6.0, -0.5);
stick([9.7 - 10, 5.3, 0], [PIV.x - 10, PIV.y, 0], 0.32, 0.24, 0x7a4b28, tree);
const branch = new THREE.Group(); branch.position.copy(PIV); scene.add(branch);
stick([0, 0, 0], [-5.4, 1.3, 0], 0.24, 0.1, 0x7a4b28, branch);
stick([-2.2, 0.55, 0], [-3.2, 1.4, 0.8], 0.12, 0.06, 0x7a4b28, branch);
[[-1.6, 1.1, 0.3, 0.9], [-3.0, 1.5, 0.6, 1.0], [-4.4, 1.7, -0.2, 0.95], [-5.4, 1.6, 0.4, 0.7], [-2.6, 1.0, -0.8, 0.8]]
  .forEach(([x, y, z, r], i) => blob(r, i % 2 ? 0x3d8b37 : 0x4aa043, x, y, z, branch));
const branchGlowMat = []; branch.traverse(o => { if (o.isMesh) branchGlowMat.push(o.material); });

// ---------- Figuren ----------
function person(shirt, x, z, rotY) {
  const g = new THREE.Group(); g.position.set(x, 0, z); g.rotation.y = rotY; scene.add(g);
  box(0.28, 0.9, 0.28, 0x2c3e66, -0.17, 0.45, 0, g); box(0.28, 0.9, 0.28, 0x2c3e66, 0.17, 0.45, 0, g);
  box(0.8, 1.0, 0.45, shirt, 0, 1.4, 0, g);
  blob(0.36, 0xf1c7a0, 0, 2.2, 0, g, 1);
  const arms = [-1, 1].map(s => {
    const a = new THREE.Group(); a.position.set(s * 0.52, 1.82, 0); g.add(a);
    box(0.22, 0.9, 0.22, shirt, 0, -0.42, 0, a); return a;
  });
  return { g, arms };
}
const you = person(0x2f80ed, 3.2, 5.6, 0.55);
const nb = person(0xf2994a, 8.6, 5.2, -0.7);
const letter = box(0.5, 0.06, 0.36, 0xffffff, 0, 0, 0); letter.visible = false;

// Säge
const saw = new THREE.Group(); scene.add(saw);
box(1.8, 0.5, 0.06, 0xb7c0c8, 0, 0, 0, saw);
for (let i = 0; i < 9; i++) { const t = box(0.14, 0.14, 0.05, 0x8a939b, -0.8 + i * 0.2, -0.27, 0, saw); t.rotation.z = Math.PI / 4; }
box(0.45, 0.65, 0.18, 0x8a5a2b, 1.05, 0.08, 0, saw);
saw.visible = false;

// Laub
const leaves = [];
for (let i = 0; i < 46; i++) {
  const m = new THREE.Mesh(new THREE.CircleGeometry(0.17, 4), new THREE.MeshStandardMaterial({ color: [0xd98b2b, 0xc9671f, 0xe0b23a, 0x9c5a1e][i % 4], side: THREE.DoubleSide, flatShading: true }));
  m.castShadow = true; scene.add(m);
  const start = new THREE.Vector3(BX - 1 - R() * 4.5, 8.2 + R() * 1.2, -1.5 + R() * 2.4);
  const inGutter = i % 3 !== 0;
  const end = inGutter ? new THREE.Vector3(eave.x + 0.2 + (R() - .5) * 0.2, eave.y - 0.05, -RD + 0.3 + R() * (RD * 2 - 0.6))
                       : onRoofR(1 + R() * (L - 1.5), -RD + 0.5 + R() * (RD * 2 - 1), 0.2);
  leaves.push({ m, start, end, t0: 3.1 + R() * 2.4, dur: 1.0 + R() * 0.6, spin: R() * 6, ph: R() * 6 });
}

// Regen
const rainGeo = new THREE.BufferGeometry(); const NR = 900; const rp = new Float32Array(NR * 6); const rseed = [];
for (let i = 0; i < NR; i++) rseed.push([CX - 16 + R() * 32, R() * 22, -12 + R() * 24]);
rainGeo.setAttribute('position', new THREE.BufferAttribute(rp, 3));
const rain = new THREE.LineSegments(rainGeo, new THREE.LineBasicMaterial({ color: 0xcfe3f5, transparent: true, opacity: 0 }));
scene.add(rain);

// Wolken
const clouds = [[-8, 17, -10], [6, 18.5, -12], [16, 16.5, -6]].map(([x, y, z]) => {
  const g = new THREE.Group(); g.position.set(x, y, z); scene.add(g);
  [[0, 0, 0, 1.6], [1.5, -0.2, 0.3, 1.2], [-1.4, -0.3, 0.2, 1.1], [0.5, 0.8, -0.2, 1.1]].forEach(([a, b, c, r]) => {
    const m = blob(r, 0xffffff, a, b, c, g); m.castShadow = false; });
  return g;
});

// ---------- Kamera-Fahrt ----------
const KEYS = [
  [0.0, [24, 18, 32], [2, 3, 0]],
  [3.0, [17, 13, 20], [2.5, 5, 0]],
  [6.4, [12, 8.5, 13], [3.6, 4.6, 0.5]],
  [10.0, [12, 14, 13], [2.6, 5.5, 0]],
  [15.3, [9, 10, 24], [4.5, 3, 2.5]],
  [21.5, [11, 9.5, 23], [5.5, 3, 2.5]],
  [27.6, [-3, 12, 22], [5, 5, 0]],
  [32.6, [-1, 10, 20], [4.5, 4, 1.5]],
  [36.5, [24, 18, 32], [2, 3, 0]],
];
function camAt(t) {
  let i = 0; while (i < KEYS.length - 2 && t > KEYS[i + 1][0]) i++;
  const [t0, p0, q0] = KEYS[i], [t1, p1, q1] = KEYS[i + 1];
  const k = smooth(t0, t1, t);
  const p = p0.map((v, j) => lerp(v, p1[j], k)), q = q0.map((v, j) => lerp(v, q1[j], k));
  // leichtes "Atmen" der Kamera
  p[0] += Math.sin(t * 0.7) * 0.25; p[1] += Math.sin(t * 0.5) * 0.15;
  camera.position.set(...p); camera.lookAt(...q);
}

// ---------- Untertitel ----------
let WORDS = [], KW = new Set();
const cap = document.getElementById('cap');
function buildWords(tl) {
  KW = new Set(tl.keywords);
  for (const s of tl.sentences) {
    const ws = s.text.split(' '); const weights = ws.map(w => w.length + 3); const tot = weights.reduce((a, b) => a + b, 0);
    let acc = s.start;
    ws.forEach((w, i) => { const d = (s.end - s.start) * weights[i] / tot; WORDS.push({ w, a: acc, b: acc + d, end: s.end }); acc += d; });
  }
}
function captions(t) {
  let cur = null;
  for (let i = 0; i < WORDS.length; i++) {
    const w = WORDS[i]; const next = WORDS[i + 1];
    const until = next && next.a - w.end < 0.05 ? next.a : w.end + 0.25;
    if (t >= w.a && t < until) cur = w;
  }
  if (!cur) { cap.textContent = ''; return; }
  cap.textContent = cur.w.toUpperCase();
  cap.className = KW.has(cur.w) ? 'key' : '';
  const s = 0.55 + 0.45 * backOut((t - cur.a) / 0.13);
  cap.style.transform = `scale(${s}) rotate(${KW.has(cur.w) ? -3 : 0}deg)`;
}

// Uhr-Ticks
(function () { const g = document.getElementById('ticks'); let h = '';
  for (let i = 0; i < 12; i++) { const a = i / 12 * Math.PI * 2; h += `<line x1="${50 + 34 * Math.sin(a)}" y1="${50 - 34 * Math.cos(a)}" x2="${50 + 38 * Math.sin(a)}" y2="${50 - 38 * Math.cos(a)}" stroke="#111" stroke-width="3"/>`; }
  g.innerHTML = h; })();
function overlay(id, a, b, t, base = '') {
  const el = document.getElementById(id);
  const inK = pop(a, 0.3, t), outK = smooth(b - 0.25, b, t);
  const vis = t >= a && t <= b;
  el.style.opacity = vis ? (1 - outK) : 0;
  el.style.transform = `translateX(-50%) scale(${vis ? inK * (1 - 0.3 * outK) : 0}) ${base}`;
  return vis;
}

// ---------- Hauptfunktion: Zustand zum Zeitpunkt t ----------
window.render = function (t) {
  camAt(t);

  // Ast wächst über dein Dach (0–2.6 s), verschwindet am Ende
  const cut = 30.3;
  if (t < cut) {
    const g = 0.08 + 0.92 * smooth(0.0, 2.6, t);
    branch.scale.setScalar(g);
    branch.position.copy(PIV); branch.rotation.set(0, 0, 0);
    // Sturm: Ast und Baum schwanken
    const storm = smooth(6.6, 7.2, t) * (1 - smooth(9.8, 10.4, t));
    const sway = Math.sin(t * 9) * 0.06 * storm + Math.sin(t * 1.3) * 0.012;
    branch.rotation.z = sway * 1.5; tree.rotation.z = sway * 0.6;
    // Saw-Phase: Ast sägen am Ende
  } else {
    // abgeschnittener Ast fliegt in den Garten
    const k = smooth(cut, cut + 1.1, t);
    const arcY = Math.sin(k * Math.PI) * 1.5;
    branch.position.set(lerp(PIV.x, 1.6, k), lerp(PIV.y, 0.45, k) + arcY, lerp(PIV.z, 4.3, k));
    branch.rotation.set(lerp(0, -0.25, k), lerp(0, 0.5, k), lerp(0, -0.24, k));
    const gone = smooth(33.0, 33.5, t);
    branch.scale.setScalar(1 - gone + 0.0001);
    tree.rotation.z = 0;
  }
  // Ast "stört": rot pulsieren
  const warn = (t > 25.2 && t < 27.6) ? (0.5 + 0.5 * Math.sin((t - 25.2) * 12)) : 0;
  branchGlowMat.forEach(m => m.emissive.setRGB(warn * 0.9, 0, 0));

  // Laub
  const clean = smooth(33.0, 33.5, t);
  for (const L of leaves) {
    const k = smooth(L.t0, L.t0 + L.dur, t);
    L.m.visible = t >= L.t0 && clean < 0.999;
    const p = L.start.clone().lerp(L.end, k);
    p.x += Math.sin(t * 3 + L.ph) * 0.4 * (1 - k); p.z += Math.cos(t * 2.4 + L.ph) * 0.3 * (1 - k);
    L.m.position.copy(p);
    L.m.rotation.set(L.spin + t * 4 * (1 - k), L.ph + t * 3 * (1 - k), 0);
    if (k >= 1) L.m.rotation.set(-Math.PI / 2, L.ph, 0);
    L.m.scale.setScalar(1 - clean + 0.0001);
  }
  gutterGlow.material.opacity = (t > 5.2 && t < 6.6) ? 0.35 + 0.35 * Math.sin((t - 5.2) * 14) : 0;

  // Sturm
  const storm = smooth(6.6, 7.2, t) * (1 - smooth(9.8, 10.6, t));
  document.getElementById('storm').style.opacity = storm * 0.85;
  sun.intensity = 2.1 * (1 - 0.65 * storm); hemi.intensity = 1.25 * (1 - 0.45 * storm);
  const fl = Math.max(0, 1 - Math.abs(t - 7.5) / 0.08) + 0.6 * Math.max(0, 1 - Math.abs(t - 7.68) / 0.06);
  document.getElementById('flash').style.opacity = fl * 0.75;
  rain.material.opacity = storm * 0.8; rain.visible = storm > 0.001;
  for (let i = 0; i < NR; i++) {
    const [x, y0, z] = rseed[i]; const y = 22 - ((22 - y0 + t * 26) % 22);
    rp.set([x, y, z, x - 0.25, y + 0.9, z], i * 6);
  }
  rainGeo.attributes.position.needsUpdate = true;

  // lose Ziegel fliegen weg
  for (const T of looseTiles) {
    const k = smooth(T.tt, T.tt + 0.9, t);
    const p = T.p.clone().lerp(T.land, k); p.y += Math.sin(k * Math.PI) * 2.2;
    T.m.position.copy(p);
    T.m.rotation.set(k * 5.2, k * 2.1, -PITCH * (1 - k) + k * 6.28);
    T.m.scale.setScalar(1 - clean + 0.0001);
  }

  // Säge: Versuch (10.8–13) und Schnitt (28.6–30.3)
  saw.visible = (t > 10.6 && t < 14.2) || (t > 28.3 && t < 31.0);
  if (t < 20) {
    const inK = smooth(10.6, 11.4, t), outK = smooth(13.0, 14.0, t);
    saw.position.set(lerp(9, 6.2, inK) + outK * 3, lerp(11, 6.6, inK) + outK * 4, 0.3);
    saw.rotation.set(0, 0, -0.9 + inK * 0.3);
    saw.scale.setScalar(Math.max(0.0001, pop(10.6, 0.35, t) * (1 - outK)));
  } else {
    const inK = smooth(28.3, 28.9, t), outK = smooth(30.4, 31.0, t);
    const stroke = (t > 28.9 && t < 30.3) ? Math.sin((t - 28.9) * 22) * 0.45 : 0;
    saw.position.set(BX + 0.1 + stroke * Math.cos(1.2), lerp(10, 6.3, inK) + stroke * Math.sin(1.2) + outK * 4, -0.5 + 0.35);
    saw.rotation.set(0, 0, 1.2 - 1.57);
    saw.scale.setScalar(Math.max(0.0001, pop(28.3, 0.35, t) * (1 - outK)));
  }

  // Grenze leuchtet
  borderWall.material.opacity = 0.22 * smooth(28.0, 28.6, t) * (1 - smooth(32.4, 33.0, t));
  borderWall.scale.y = Math.max(0.0001, smooth(28.0, 28.7, t));
  borderWall.position.y = 5 * borderWall.scale.y;

  // Figuren
  const ppl = pop(15.4, 0.4, t) * (1 - smooth(32.8, 33.2, t));
  you.g.scale.setScalar(Math.max(0.0001, ppl)); nb.g.scale.setScalar(Math.max(0.0001, ppl));
  you.g.visible = nb.g.visible = ppl > 0.001;
  const wave = smooth(15.8, 16.2, t) * (1 - smooth(17.0, 17.4, t));
  you.arms[1].rotation.x = -2.6 * wave;
  const shrug = smooth(22.2, 22.6, t) * (1 - smooth(26.6, 27.0, t)) * (0.75 + 0.25 * Math.sin(t * 6));
  nb.arms[0].rotation.z = -1.2 * shrug; nb.arms[1].rotation.z = 1.2 * shrug;
  const point = smooth(29.0, 29.4, t) * (1 - smooth(32.0, 32.4, t));
  you.arms[0].rotation.x = -2.0 * point;
  // Brief mit Frist
  const lk = smooth(16.3, 17.7, t);
  letter.visible = t > 16.2 && t < 18.0;
  if (letter.visible) {
    const A = new THREE.Vector3(3.6, 3.0, 5.4), B = new THREE.Vector3(8.2, 2.0, 5.2);
    letter.position.copy(A.lerp(B, lk)); letter.position.y += Math.sin(lk * Math.PI) * 2.0;
    letter.rotation.set(0.3, lk * 6.28, 0.2); letter.scale.setScalar(1.4 * (1 - smooth(17.6, 18.0, t)) + 0.0001);
  }

  // Wolken
  clouds.forEach((c, i) => { c.position.x += 0; c.position.x = [-8, 6, 16][i] + Math.sin(t * 0.08 + i) * 2 + t * 0.06; });

  // Overlays
  overlay('ovNo', 12.0, 15.2, t);
  const cv = overlay('ovClock', 18.2, 22.4, t);
  if (cv) {
    const a = smooth(18.5, 21.8, t) * Math.PI * 2;
    const hx = 50 + 32 * Math.sin(a), hy = 50 - 32 * Math.cos(a);
    document.getElementById('hand').setAttribute('x2', hx); document.getElementById('hand').setAttribute('y2', hy);
    const large = a > Math.PI ? 1 : 0;
    document.getElementById('sweep').setAttribute('d', a > 0.01 ? `M50 50 L50 12 A38 38 0 ${large} 1 ${50 + 38 * Math.sin(a)} ${50 - 38 * Math.cos(a)} Z` : '');
  }
  overlay('ovQ', 22.4, 25.2, t);
  overlay('ovOk', 32.6, 36.6, t);
  const hk = smooth(33.6, 34.0, t);
  const hd = document.getElementById('handle'); hd.style.opacity = hk; hd.style.transform = `scale(${0.7 + 0.3 * pop(33.6, 0.3, t)})`;

  captions(t);
  renderer.render(scene, camera);
};

window.ready = (async () => {
  const tl = await (await fetch('timeline.json')).json();
  buildWords(tl);
  await document.fonts.load('150px Lucky', 'ÄÖÜ');
  await document.fonts.ready;
  window.render(0);
  return tl;
})();
</script>
