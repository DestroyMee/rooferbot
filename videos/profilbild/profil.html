<!doctype html>
<html><head><meta charset="utf-8"><title>Coco Profilbild</title>
<style>html,body{margin:0;width:1080px;height:1080px;overflow:hidden}svg{display:block}</style></head>
<body><svg id="s" width="1080" height="1080" viewBox="0 0 1080 1080"></svg>
<script>
const INK = '#1d2b53';
function coco({ hat = 'beret' }) {
  const eye = ex => `<ellipse cx="${ex}" cy="-14" rx="11" ry="14" fill="${INK}"/><circle cx="${ex + 4}" cy="-19" r="4.5" fill="#fff"/><circle cx="${ex - 3}" cy="-8" r="2" fill="#fff"/>`;
  const beret = `<g transform="translate(6 -66) rotate(-12)"><ellipse rx="62" ry="22" fill="#ef3340" stroke="${INK}" stroke-width="6"/><path d="M0 -22 q4 -16 12 -14" stroke="${INK}" stroke-width="6" fill="none" stroke-linecap="round"/></g>`;
  const grad = `<g transform="translate(0 -70) rotate(-8)">
      <path d="M-40 -6 L-40 18 Q0 34 40 18 L40 -6Z" fill="#2b2d42" stroke="${INK}" stroke-width="6" stroke-linejoin="round"/>
      <path d="M-78 -14 L0 -42 L78 -14 L0 14Z" fill="#3d405b" stroke="${INK}" stroke-width="6" stroke-linejoin="round"/>
      <circle cx="0" cy="-14" r="6" fill="#ffd166" stroke="${INK}" stroke-width="3"/>
      <path d="M0 -14 L70 -14 L70 22" stroke="${INK}" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M0 -14 L70 -14 L70 22" stroke="#ffd166" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="62" y="20" width="16" height="26" rx="5" fill="#ffd166" stroke="${INK}" stroke-width="3"/></g>`;
  return `
    <g transform="translate(-66 18) rotate(10)"><ellipse cx="-10" cy="0" rx="26" ry="16" fill="#ffc300" stroke="${INK}" stroke-width="5" transform="rotate(-20)"/></g>
    <g transform="translate(66 18) rotate(-60)"><ellipse cx="10" cy="0" rx="26" ry="16" fill="#ffc300" stroke="${INK}" stroke-width="5" transform="rotate(20)"/></g>
    <circle r="78" fill="#ffd60a" stroke="${INK}" stroke-width="6"/>
    <ellipse cx="-22" cy="-46" rx="22" ry="12" fill="#fff" opacity=".45" transform="rotate(-25 -22 -46)"/>
    <ellipse cx="0" cy="34" rx="44" ry="34" fill="#fff3b0"/>
    ${eye(-26)}${eye(26)}
    <ellipse cx="-46" cy="10" rx="12" ry="7" fill="#ff8fab" opacity=".85"/><ellipse cx="46" cy="10" rx="12" ry="7" fill="#ff8fab" opacity=".85"/>
    <path d="M-12 6 L12 6 L0 26 Z" fill="#ff9f1c" stroke="${INK}" stroke-width="4" stroke-linejoin="round"/><path d="M-12 6 L12 6 L0 13Z" fill="#e85d04"/>
    ${hat === 'beret' ? beret : grad}`;
}
function star(x, y, s, c) { let d = ''; for (let i = 0; i < 10; i++) { const r = i % 2 ? 7 : 16, a = i * Math.PI / 5 - Math.PI / 2; d += (i ? 'L' : 'M') + (r * Math.cos(a)).toFixed(1) + ' ' + (r * Math.sin(a)).toFixed(1); }
  return `<path transform="translate(${x} ${y}) scale(${s})" d="${d}Z" fill="${c}" stroke="${INK}" stroke-width="3" stroke-linejoin="round"/>`; }
function bubble(x, y, s) { // Sprechblase mit Globus (sprachneutral)
  return `<g transform="translate(${x} ${y}) scale(${s}) rotate(8)">
    <path d="M-60 -50 h120 a30 30 0 0 1 30 30 v50 a30 30 0 0 1 -30 30 h-70 l-34 30 l6 -30 h-22 a30 30 0 0 1 -30 -30 v-50 a30 30 0 0 1 30 -30z" fill="#fff" stroke="${INK}" stroke-width="7" stroke-linejoin="round"/>
    <g transform="translate(0 5)"><circle r="34" fill="#4dabf7" stroke="${INK}" stroke-width="5"/>
      <path d="M-20 -22 q14 6 6 16 q-10 4 -4 14 q8 6 2 16 M8 -30 q-2 12 10 14 q12 0 12 12 M6 10 q10 -4 16 6 q2 10 -6 14" fill="none" stroke="#51cf66" stroke-width="7" stroke-linecap="round"/>
      <circle r="34" fill="none" stroke="${INK}" stroke-width="5"/></g></g>`;
}
const V = {
  a: { bg: ['#8ecae6', '#5fa8d3'], hat: 'beret', extra: '' },
  b: { bg: ['#b9f0c4', '#74c69d'], hat: 'beret', extra: () => bubble(815, 270, 1.9) },
  c: { bg: ['#ffc2d1', '#ff8fab'], hat: 'grad', extra: () => star(210, 260, 2.2, '#ffd166') + star(860, 330, 1.6, '#fff') + star(180, 760, 1.2, '#fff') },
};
window.draw = k => {
  const v = V[k];
  const cx = k === 'b' ? 500 : 540;
  document.getElementById('s').innerHTML = `
    <defs><radialGradient id="g" cx="50%" cy="40%" r="70%"><stop offset="0" stop-color="${v.bg[0]}"/><stop offset="1" stop-color="${v.bg[1]}"/></radialGradient></defs>
    <rect width="1080" height="1080" fill="url(#g)"/>
    ${[...Array(10)].map((_, i) => `<circle cx="${(i * 233) % 1080}" cy="${(i * 397 + 120) % 1080}" r="${18 + (i % 3) * 10}" fill="#fff" opacity=".18"/>`).join('')}
    <ellipse cx="${cx}" cy="985" rx="300" ry="40" fill="rgba(29,43,83,.15)"/>
    <g transform="translate(${cx} 630) scale(4.1)">${coco({ hat: v.hat })}</g>
    ${typeof v.extra === 'function' ? v.extra() : v.extra}`;
};
</script></body></html>
